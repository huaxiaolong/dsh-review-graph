# Publish on a version tag, from GitHub's runners, with no token at all.
#
# npm is removing direct publish from tokens that bypass 2FA (targeted for
# January 2027), so a stored NPM_TOKEN is not a durable answer. Trusted
# publishing instead trusts this repository's workflow through OIDC: the runner
# proves which repo, workflow and commit it is, and npm mints a short-lived
# credential for that publish alone. Nothing secret is stored here.
#
# Setup (once, on npmjs.com): the package's settings page → Trusted publishing →
# add a publisher: repository huaxiaolong/dsh-review-graph, workflow publish.yml.
# The first version must be published with an OTP first, because the settings
# page only exists once the package does:
#   npm publish --otp=<code>
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token npm exchanges for a publish credential.
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs an npm CLI that speaks OIDC (11.5.1 or later),
      # which Node 20's bundled npm is not. Pin the major on purpose: `npm@latest`
      # is npm 12, which requires Node ^22.22.2 and fails the install on a runner
      # whose Node is older than that — an engine error during setup, before
      # anything of this package has run.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11 && npm --version

      # Prism is a build-time dependency; the build fetches it.
      - name: Build
        run: node build-vendor.mjs && node build-client.mjs

      - name: Self-checks
        run: |
          node test/selftest.mjs
          node test/git-scopes.mjs
          node test/host-routes.mjs
          node test/diff-parse.mjs
          node test/flow-parse.mjs

      # No NODE_AUTH_TOKEN: trusted publishing supplies the credential, and
      # --provenance signs the tarball against this workflow and commit.
      - name: Publish
        run: npm publish --provenance --access public
